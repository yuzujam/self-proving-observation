# self-proving-observation/
# └── baseline/
#     └── logstash/
#         └── pipeline.conf  — 対照実験合成トラフィック（HTTP POST）→ Elasticsearch パイプライン

input {
  # 外部からの HTTP POST 入力（攻撃ジェネレーター用）
  http {
    port => 5080
    codec => "json"
  }
}

filter {
  # タイムスタンプのパース
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # inject_id がない場合はデフォルト値を設定
  if ![inject_id] {
    mutate {
      add_field => { "inject_id" => "" }
    }
  }

  # event_type がない場合
  if ![event_type] {
    mutate {
      add_field => { "event_type" => "unknown" }
    }
  }

  # GeoIP エンリッチメント（アタックマップ用）
  if [src_ip] {
    geoip {
      source => "src_ip"
      target => "geoip"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "threat-events-%{+YYYY.MM}"
  }
}
