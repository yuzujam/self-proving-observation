# self-proving-observation/
# └── baseline/
#     └── docker-compose.yml  — 第1号機: T-Pot標準ELKスタック

name: baseline

services:
  # 1. Elasticsearch：全文検索・ログストレージ
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2048m -Xmx2048m
    restart: always
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # 2. Logstash：ログ収集・パース・転送
  logstash:
    image: docker.elastic.co/logstash/logstash:9.4.3
    environment:
      - LS_JAVA_OPTS=-Xms1g -Xmx1g
    restart: always
    volumes:
      - ./logstash/pipeline.conf:/usr/share/logstash/pipeline/pipeline.conf:ro
    ports:
      - "5080:5080"   # HTTP JSON input (pipeline.conf, attack generator)
      - "9600:9600"   # Monitoring API
    depends_on:
      elasticsearch:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # 3. Kibana：可視化ダッシュボード
  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.3
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    restart: always
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  es_data:
